kind = "web"
previewPath = "/"
title = "Gym OS"
version = "1.0.0"
id = "artifacts/gym-os"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21212

[services.development]
run = "pnpm --filter @workspace/gym-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gym-os", "run", "build" ]
publicDir = "artifacts/gym-os/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21212"
BASE_PATH = "/"

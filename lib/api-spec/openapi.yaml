openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Gym OS API — unified client data from TeamUp, Trainerize, and InBody
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: sync
    description: Data synchronization from external platforms
  - name: dashboard
    description: Dashboard summary data
  - name: ai
    description: AI-powered client insights and suggestions

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients with summary data
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: engagementStatus
          in: query
          schema:
            type: string
            enum: [active, at_risk, disengaged]
        - name: needsMealPlan
          in: query
          schema:
            type: boolean
        - name: isMember
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSummary"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get full client detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client and all associated data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Client deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateClient
      tags: [clients]
      summary: Update editable client fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{id}/scans:
    get:
      operationId: getClientScans
      tags: [clients]
      summary: Get InBody scan history for a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InBodyScan"

  /clients/{id}/attendance:
    get:
      operationId: getClientAttendance
      tags: [clients]
      summary: Get attendance records for a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"

  /clients/{id}/ai/insight:
    post:
      operationId: generateClientInsight
      tags: [ai]
      summary: Generate AI insight for a client and persist it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated insight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiInsight"
        "400":
          description: AI not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{id}/ai/checkin:
    post:
      operationId: generateCheckinDraft
      tags: [ai]
      summary: Generate a check-in message draft for a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated check-in draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinDraft"
        "400":
          description: AI not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{id}/ai/checkins:
    get:
      operationId: listCheckinDrafts
      tags: [ai]
      summary: List recent check-in drafts for a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of check-in drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckinDraft"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{id}/ai/checkins/{draftId}:
    patch:
      operationId: updateCheckinDraft
      tags: [ai]
      summary: Update check-in draft status (mark sent or dismissed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: draftId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinDraftUpdate"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinDraft"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{id}/ai/macros:
    post:
      operationId: generateMacroTargets
      tags: [ai]
      summary: Generate AI macro targets for a client and persist them
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated client with AI-generated macro targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSummary"
        "400":
          description: AI not configured or no InBody scan available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{id}/macros:
    patch:
      operationId: updateClientMacros
      tags: [clients]
      summary: Manually set macro targets for a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MacroUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/membership:
    get:
      operationId: getMembershipReport
      tags: [reports]
      summary: Get rolling 12-month membership metrics from TeamUp
      responses:
        "200":
          description: Membership report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipReport"
        "503":
          description: TeamUp credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/membership/drilldown:
    get:
      operationId: getMembershipDrilldown
      tags: [reports]
      summary: Get member list for a specific month and category
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
          description: Month in YYYY-MM format
        - name: category
          in: query
          required: true
          schema:
            type: string
            enum: [active, new, churned]
      responses:
        "200":
          description: Drilldown member list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipDrilldown"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: TeamUp credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/attendance-heatmap:
    get:
      operationId: getAttendanceHeatmap
      tags: [reports]
      summary: Get attendance counts per class name and day of week
      responses:
        "200":
          description: Attendance heatmap rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceHeatmapRow"

  /reports/cohort-retention:
    get:
      operationId: getCohortRetention
      tags: [reports]
      summary: Get member cohort retention data from TeamUp
      responses:
        "200":
          description: Cohort retention report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohortRetentionReport"
        "503":
          description: TeamUp credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/ai-insight:
    get:
      operationId: getAiInsight
      tags: [reports]
      summary: Latest TeamUp AI business advisor report shaped for GymOS
      responses:
        "200":
          description: AI insight report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiInsightReport"
        "503":
          description: TeamUp credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/class-analytics:
    get:
      operationId: getClassAnalytics
      tags: [reports]
      summary: Get class utilization analytics from GoTeamUp
      responses:
        "200":
          description: Class analytics report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassAnalyticsReport"
        "503":
          description: TeamUp credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sync:
    post:
      operationId: syncAll
      tags: [sync]
      summary: Trigger full data sync from TeamUp, Trainerize, and InBody
      responses:
        "200":
          description: Sync result summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/birthdays:
    get:
      operationId: getDashboardBirthdays
      tags: [dashboard]
      summary: Get active clients with birthdays in the next 60 days
      responses:
        "200":
          description: Upcoming birthdays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingBirthday"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ClientSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        goals:
          type: ["string", "null"]
        needsMealPlan:
          type: boolean
        isMember:
          type: boolean
        notes:
          type: ["string", "null"]
        engagementStatus:
          type: string
          enum: [active, at_risk, disengaged, unknown]
        weeklyAttendanceAvg:
          type: ["number", "null"]
        lastAttendanceDate:
          type: ["string", "null"]
        lastTrainingDate:
          type: ["string", "null"]
        workoutCompliancePct:
          type: ["number", "null"]
        latestScanDate:
          type: ["string", "null"]
        latestWeight:
          type: ["number", "null"]
        latestBodyFatPct:
          type: ["number", "null"]
        latestMuscleMass:
          type: ["number", "null"]
        lastSyncedAt:
          type: ["string", "null"]
        teamupId:
          type: ["string", "null"]
        trainerizeId:
          type: ["string", "null"]
        inbodyId:
          type: ["string", "null"]
        dailyCalorieTarget:
          type: ["number", "null"]
        proteinTargetG:
          type: ["number", "null"]
        carbsTargetG:
          type: ["number", "null"]
        fatTargetG:
          type: ["number", "null"]
        macroTargetsUpdatedAt:
          type: ["string", "null"]
        macroTargetsRationale:
          type: ["string", "null"]
        lastAiInsight:
          type: ["string", "null"]
        lastAiInsightAt:
          type: ["string", "null"]
        birthday:
          type: ["string", "null"]
          description: Date of birth in YYYY-MM-DD format
      required:
        - id
        - name
        - needsMealPlan
        - isMember
        - engagementStatus

    ClientDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        goals:
          type: ["string", "null"]
        needsMealPlan:
          type: boolean
        isMember:
          type: boolean
        notes:
          type: ["string", "null"]
        engagementStatus:
          type: string
          enum: [active, at_risk, disengaged, unknown]
        weeklyAttendanceAvg:
          type: ["number", "null"]
        lastAttendanceDate:
          type: ["string", "null"]
        lastTrainingDate:
          type: ["string", "null"]
        workoutCompliancePct:
          type: ["number", "null"]
        latestScanDate:
          type: ["string", "null"]
        latestWeight:
          type: ["number", "null"]
        latestBodyFatPct:
          type: ["number", "null"]
        latestMuscleMass:
          type: ["number", "null"]
        lastSyncedAt:
          type: ["string", "null"]
        teamupId:
          type: ["string", "null"]
        trainerizeId:
          type: ["string", "null"]
        inbodyId:
          type: ["string", "null"]
        dailyCalorieTarget:
          type: ["number", "null"]
        proteinTargetG:
          type: ["number", "null"]
        carbsTargetG:
          type: ["number", "null"]
        fatTargetG:
          type: ["number", "null"]
        macroTargetsUpdatedAt:
          type: ["string", "null"]
        macroTargetsRationale:
          type: ["string", "null"]
        lastAiInsight:
          type: ["string", "null"]
        lastAiInsightAt:
          type: ["string", "null"]
        birthday:
          type: ["string", "null"]
          description: Date of birth in YYYY-MM-DD format
        recentScans:
          type: array
          items:
            $ref: "#/components/schemas/InBodyScan"
        recentAttendance:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceRecord"
      required:
        - id
        - name
        - needsMealPlan
        - isMember
        - engagementStatus
        - recentScans
        - recentAttendance

    ClientUpdate:
      type: object
      properties:
        goals:
          type: ["string", "null"]
        needsMealPlan:
          type: boolean
        isMember:
          type: boolean
        notes:
          type: ["string", "null"]
        birthday:
          type: ["string", "null"]
          description: Date of birth in YYYY-MM-DD format

    MacroUpdate:
      type: object
      properties:
        dailyCalorieTarget:
          type: ["number", "null"]
        proteinTargetG:
          type: ["number", "null"]
        carbsTargetG:
          type: ["number", "null"]
        fatTargetG:
          type: ["number", "null"]

    CheckinDraftUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [draft, sent, dismissed]
      required:
        - status

    AiInsight:
      type: object
      properties:
        insight:
          type: string
        generatedAt:
          type: string
      required:
        - insight
        - generatedAt

    CheckinDraft:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        draftText:
          type: string
        status:
          type: string
          enum: [draft, sent, dismissed]
        createdAt:
          type: ["string", "null"]
      required:
        - id
        - clientId
        - draftText
        - status

    InBodyScan:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        scannedAt:
          type: string
        weightKg:
          type: ["number", "null"]
        bodyFatPct:
          type: ["number", "null"]
        muscleMassKg:
          type: ["number", "null"]
        bmr:
          type: ["number", "null"]
        visceralFatLevel:
          type: ["number", "null"]
        bmi:
          type: ["number", "null"]
        totalBodyWaterKg:
          type: ["number", "null"]
      required:
        - id
        - clientId
        - scannedAt

    AttendanceRecord:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        date:
          type: string
        className:
          type: ["string", "null"]
      required:
        - id
        - clientId
        - date

    SyncResult:
      type: object
      properties:
        success:
          type: boolean
        clientsUpdated:
          type: integer
        attendanceRecordsAdded:
          type: integer
        trainingSessionsAdded:
          type: integer
        scansAdded:
          type: integer
        syncedAt:
          type: string
        errors:
          type: array
          items:
            type: string
        configuredSources:
          type: array
          items:
            type: string
        missingSources:
          type: array
          items:
            type: string
      required:
        - success
        - clientsUpdated
        - attendanceRecordsAdded
        - trainingSessionsAdded
        - scansAdded
        - syncedAt
        - errors
        - configuredSources
        - missingSources

    DashboardStats:
      type: object
      properties:
        totalClients:
          type: integer
        activeClients:
          type: integer
        atRiskClients:
          type: integer
        disengagedClients:
          type: integer
        needsMealPlanCount:
          type: integer
        overdueInBodyCount:
          type: integer
        lastSyncedAt:
          type: ["string", "null"]
        avgWeeklyAttendance:
          type: ["number", "null"]
      required:
        - totalClients
        - activeClients
        - atRiskClients
        - disengagedClients
        - needsMealPlanCount
        - overdueInBodyCount

    UpcomingBirthday:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        birthday:
          type: string
          description: YYYY-MM-DD stored date of birth
        birthdayThisYear:
          type: string
          description: YYYY-MM-DD of the upcoming birthday occurrence
        daysUntil:
          type: integer
        photoUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - birthday
        - birthdayThisYear
        - daysUntil

    MembershipMonthData:
      type: object
      properties:
        month:
          type: string
        activeMembers:
          type: integer
        newMembers:
          type: integer
        churnedMembers:
          type: integer
        churnPct:
          type: number
        revenue:
          type: number
      required:
        - month
        - activeMembers
        - newMembers
        - churnedMembers
        - churnPct
        - revenue

    MembershipCurrent:
      type: object
      properties:
        activeMembers:
          type: integer
        revenueTrailing12m:
          type: number
        momChange:
          type: integer
      required:
        - activeMembers
        - revenueTrailing12m
        - momChange

    ExpiringMembership:
      type: object
      properties:
        name:
          type: string
        planName:
          type: string
        expiresOn:
          type: string
      required:
        - name
        - planName
        - expiresOn

    MembershipBreakdownItem:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
      required:
        - name
        - count

    MembershipReport:
      type: object
      properties:
        months:
          type: array
          items:
            $ref: "#/components/schemas/MembershipMonthData"
        current:
          $ref: "#/components/schemas/MembershipCurrent"
        membershipBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/MembershipBreakdownItem"
        upcomingExpirations:
          type: array
          items:
            $ref: "#/components/schemas/ExpiringMembership"
      required:
        - months
        - current
        - membershipBreakdown
        - upcomingExpirations

    MembershipDrilldownMember:
      type: object
      properties:
        name:
          type: string
        planName:
          type: string
        startDate:
          type: ["string", "null"]
        expiresOn:
          type: ["string", "null"]
      required:
        - name
        - planName
        - startDate
        - expiresOn

    MembershipDrilldown:
      type: object
      properties:
        month:
          type: string
        category:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/MembershipDrilldownMember"
      required:
        - month
        - category
        - members

    AttendanceHeatmapRow:
      type: object
      properties:
        className:
          type: string
        dayOfWeek:
          type: integer
          description: 0=Sunday, 1=Monday, ..., 6=Saturday
        avgAttendance:
          type: number
        totalSessions:
          type: integer
      required:
        - className
        - dayOfWeek
        - avgAttendance
        - totalSessions

    CohortRow:
      type: object
      properties:
        cohort:
          type: string
        size:
          type: integer
        m1:
          type: ["number", "null"]
        m3:
          type: ["number", "null"]
        m6:
          type: ["number", "null"]
        m12:
          type: ["number", "null"]
      required:
        - cohort
        - size
        - m1
        - m3
        - m6
        - m12

    CohortRetentionReport:
      type: object
      properties:
        cohorts:
          type: array
          items:
            $ref: "#/components/schemas/CohortRow"
      required:
        - cohorts

    AiInsightAction:
      type: object
      properties:
        action:
          type: string
        purpose:
          type: string
        timeRequired:
          type: string
      required: [action, purpose, timeRequired]

    AiInsightStrength:
      type: object
      properties:
        title:
          type: string
        metric:
          type: string
        insight:
          type: string
        percentile:
          type: ["string", "null"]
      required: [title, metric, insight]

    AiInsightBottomLine:
      type: object
      properties:
        situation:
          type: string
        opportunity:
          type: string
        recommendation:
          type: string
      required: [situation, opportunity, recommendation]

    ClassStatus:
      type: string
      enum: [cut, grow, healthy, full]

    ClassUtilization:
      type: object
      required: [name, day, time, avgAttendees, capacity, fillRate, fillPct, sessionsCount, growthGap, status]
      properties:
        name:
          type: string
        day:
          type: string
